services:
  coordinator:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: docstore-coordinator
    command: >
      sh -c "if [ ! -f /shared/shard_map.json ]; then cp /config/shard_map.json /shared/shard_map.json; fi;
             python -m docstore.coordinator"
    env_file:
      - ../.env
    environment:
      - HOST=0.0.0.0
      - PORT=8100
      - SHARD_MAP_PATH=/shared/shard_map.json
      - DATA_DIR=/data
      - ENABLE_TEST_HOOKS=false
    volumes:
      - coord_data:/data
      - shared_map:/shared
      - ./shard_map.json:/config/shard_map.json:ro
    ports:
      - "127.0.0.1:8100:8100"
    networks:
      - docstore_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  shard0-follower:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: docstore-shard0-follower
    command: python -m docstore.shard
    env_file:
      - ../.env
    environment:
      - HOST=0.0.0.0
      - PORT=8201
      - NODE_ID=shard0-follower
      - SHARD_ID=shard0
      - ROLE=follower
      - DATA_DIR=/data
      - COORDINATOR_URL=http://coordinator:8100
      - ENABLE_TEST_HOOKS=false
      - SHARD_RANGE_START=0
      - SHARD_RANGE_END=3074457345618258602
      - SHARD_OWNERSHIP_EPOCH=1
    volumes:
      - s0_f_data:/data
    networks:
      - docstore_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8201/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped

